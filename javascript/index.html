<!DOCTYPE html>
<html>
   <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .calculator{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            width:300px;
            text-align:center;
        }

        h1{
            color:#0077cc;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            font-size:18px;
        }

        button{
            padding:10px 15px;
            margin:5px;
            border:none;
            background:#0077cc;
            color:white;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#005fa3;
        }

        #result{
            margin-top:20px;
            font-size:22px;
            color:green;
        }

    </style>

</head>
    <boby>
     <div class="calculator">

        <h1>Calculator</h1>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="add()">+</button>
        <button onclick="subtract()">-</button>
        <button onclick="multiply()">*</button>
        <button onclick="divide()">/</button>

        <div id="result">Result: </div>

    </div>
    <script>
        function add(){

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result = num1 + num2;

            document.getElementById("result").innerHTML =
            "Result: " + result;
        }

        function subtract(){

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result = num1 - num2;

            document.getElementById("result").innerHTML =
            "Result: " + result;
        }

        function multiply(){

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result = num1 * num2;

            document.getElementById("result").innerHTML =
            "Result: " + result;
        }

        function divide(){

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result = num1 / num2;

            document.getElementById("result").innerHTML =
            "Result: " + result;
        }
    </script>
    </boby>
</html>
